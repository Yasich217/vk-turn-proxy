name: Build Server Binary

on:
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build linux amd64 server
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/vk-turn-server-v2 ./server/cmd/turn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vk-turn-server-v2-linux-amd64
          path: dist/vk-turn-server-v2
