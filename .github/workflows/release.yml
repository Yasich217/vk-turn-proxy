name: Release

on:
  push:
    branches:
      - v2.0
  workflow_dispatch:

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cgo: 0
          - goos: linux
            goarch: arm64
            cgo: 0
          - goos: linux
            goarch: 386
            cgo: 0
          - goos: linux
            goarch: arm
            goarm: '7'
            cgo: 0
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            cgo: 0
          - goos: linux
            goarch: mips
            gomips: softfloat
            cgo: 0
          - goos: linux
            goarch: mips64le
            gomips: softfloat
            cgo: 0
          - goos: linux
            goarch: riscv64
            cgo: 0            
          - goos: darwin
            goarch: amd64
            cgo: 0
          - goos: darwin
            goarch: arm64
            cgo: 0
          - goos: windows
            goarch: amd64
            cgo: 0
          - goos: windows
            goarch: arm64
            cgo: 0
          - goos: windows
            goarch: 386
            cgo: 0
          - goos: android
            goarch: arm64
            cgo: 1
            api: 21
          - goos: android
            goarch: arm
            cgo: 1
            api: 21
          - goos: freebsd
            goarch: amd64
            cgo: 0

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'

      # Install Android NDK only for android rows
      - name: Setup Android NDK
        if: matrix.goos == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo }}
          ANDROID_API: ${{ matrix.api }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "Building for $GOOS/$GOARCH${GOARM:+/arm$GOARM} (CGO_ENABLED=$CGO_ENABLED)"

          if [ "$GOOS" = "android" ]; then
            if [ -z "$ANDROID_NDK_HOME" ]; then
              echo "ANDROID_NDK_HOME is not set – did setup-ndk run?"
              exit 1
            fi

            TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

            if [ "$GOARCH" = "arm64" ]; then
              export CC="$TOOLCHAIN_BIN/aarch64-linux-android${ANDROID_API}-clang"
            elif [ "$GOARCH" = "arm" ]; then
              export CC="$TOOLCHAIN_BIN/armv7a-linux-androideabi${ANDROID_API}-clang"
            else
              echo "Unsupported ANDROID GOARCH=$GOARCH"
              exit 1
            fi

            echo "Using Android NDK CC=$CC"
          fi

          rm -rf dist
          mkdir -p dist

          # Set extension for windows
          if [ "${GOOS}" = "windows" ]; then
            EXT=.exe
          else
            EXT=
          fi

          GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM GOMIPS=$GOMIPS \
          go build -ldflags "-s -w -checklinkname=0" -trimpath \
            -o "dist/client-${GOOS}-${GOARCH}${EXT}" \
            ./client
          
          GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM GOMIPS=$GOMIPS \
          go build -ldflags "-s -w -checklinkname=0" -trimpath \
            -o "dist/server-${GOOS}-${GOARCH}${EXT}" \
            ./server/cmd/turn

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: good-turn-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/**

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        run: |
          COMMIT_SUBJECT=$(git log -1 --format=%s)
          COMMIT_BODY=$(git log -1 --format=%b)
          {
            echo "## ${COMMIT_SUBJECT}"
            echo
            printf '%s\n' "${COMMIT_BODY}"
          } > RELEASE_NOTES.md

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Get release metadata
        id: release_meta
        run: |
          BASE_VERSION="v2.0.8"
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=${BASE_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # upload every file in dist/ including nested files
          files: |
            dist/**
          # make the release name/tag unique per successful build
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove old releases and tags
        uses: actions/github-script@v7
        env:
          CURRENT_TAG: ${{ steps.release_meta.outputs.release_tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const currentTag = process.env.CURRENT_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            for (const release of releases) {
              if (release.tag_name === currentTag) {
                continue;
              }
              core.info(`Deleting stale release ${release.tag_name} (#${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                core.info(`Tag cleanup skipped for ${release.tag_name}: ${error.message}`);
              }
            }
